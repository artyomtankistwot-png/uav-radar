<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UAV Radar — Tactical Glass Edition</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.15);
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --accent-green: #22c55e;
            --tile-filter: brightness(0.9) contrast(1.1);
        }

        .dark-mode {
            --tile-filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617;
            color: var(--text-main);
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .leaflet-tile-container img {
            filter: var(--tile-filter);
            transition: filter 0.4s ease;
        }

        /* Glassmorphism Panel Base */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: var(--shadow-glass);
            z-index: 1000;
            position: absolute;
        }

        /* Верхняя панель: Шапка и Поиск */
        .top-bar {
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            max-width: 600px;
            padding: 8px 12px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
        }

        .status-container {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        /* Тултип сетевого статуса при наведении */
        .status-tooltip {
            position: absolute;
            top: 25px;
            left: 0;
            width: 180px;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            box-shadow: var(--shadow-glass);
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-5px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 3000;
        }

        .status-container:hover .status-tooltip {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .tooltip-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 4px;
        }

        .tooltip-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-main);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 4px 8px;
            width: 100%;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 13px;
            width: 100%;
            padding: 4px 8px;
        }

        .search-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        /* Всплывающая плашка оповещения */
        .alert-banner {
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            width: 90%;
            max-width: 450px;
            padding: 12px 16px;
            border-left: 4px solid var(--accent-red);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
        }

        .alert-banner.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .alert-icon {
            font-size: 24px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .alert-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        .alert-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .alert-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

        .alert-sub {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* Кнопки управления справа */
        .controls-panel {
            top: 80px;
            right: 16px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* Статистика снизу */
        .stats-panel {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-red);
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: var(--border-glass);
        }

        /* Иконки целей */
        .liquid-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .uav-svg {
            width: 32px;
            height: 32px;
            z-index: 2;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }

        .liquid-marker:hover .uav-svg {
            transform: scale(1.25) !important;
        }

        /* Leaflet Popup styling */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid var(--border-glass) !important;
            color: var(--text-main) !important;
            border-radius: 14px !important;
        }

        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.9) !important;
        }

        .popup-card {
            padding: 6px;
            font-size: 13px;
        }

        .popup-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-red);
            margin-bottom: 6px;
        }

        .tg-copy-btn {
            margin-top: 8px;
            width: 100%;
            background: #24A1DE;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .tg-copy-btn:hover {
            background: #1c82b5;
        }

        @media (max-width: 480px) {
            .top-bar {
                left: 10px;
                right: 10px;
            }
            .logo-box span {
                display: none;
            }
            .alert-banner {
                top: 75px;
                width: 95%;
            }
        }
    </style>
</head>
<body class="dark-mode">

    <div id="map"></div>

    <!-- Верхняя панель -->
    <div class="glass-panel top-bar">
        <div class="logo-box">
            <div class="status-container">
                <div class="status-dot" id="statusDot"></div>
                <div class="status-tooltip" id="statusTooltip">
                    <div class="tooltip-title">СЕТЕВОЙ СТАТУС</div>
                    <div class="tooltip-row"><span>Пинг (RTT):</span> <b id="pingVal">-- ms</b></div>
                    <div class="tooltip-row"><span>Задержка API:</span> <b id="apiLatencyVal">-- ms</b></div>
                    <div class="tooltip-row"><span>Состояние:</span> <b style="color: var(--accent-green);" id="networkState">Стабильно</b></div>
                </div>
            </div>
            <span>RADAR</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск населенного пункта...">
            <button class="search-btn" id="searchBtn">🔍</button>
        </div>
    </div>

    <!-- Всплывающая плашка оповещения -->
    <div class="glass-panel alert-banner" id="alertBanner">
        <div class="alert-icon">⚠️</div>
        <div class="alert-content">
            <div class="alert-title" id="alertTitle">ОБНАРУЖЕНА ЦЕЛЬ</div>
            <div class="alert-text" id="alertText">Загрузка информации...</div>
            <div class="alert-sub" id="alertSub">Курс: --</div>
        </div>
    </div>

    <!-- Панель управления справа -->
    <div class="glass-panel controls-panel">
        <button class="glass-btn" id="soundToggle" title="Звук">🔊</button>
        <button class="glass-btn" id="themeToggle" title="Тема">🌙</button>
        <button class="glass-btn" id="recenterBtn" title="Центрировать">🎯</button>
    </div>

    <!-- Нижняя статистика -->
    <div class="glass-panel stats-panel">
        <div class="stat-item">
            <span class="stat-value" id="activeCount">0</span>
            <span class="stat-label">Целей</span>
        </div>
        <div class="divider"></div>
        <div class="stat-item">
            <span class="stat-value" style="color: var(--accent-orange)" id="kabCount">0</span>
            <span class="stat-label">КАБы</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- Web Audio API Синтезатор звуков ---
        let soundEnabled = true;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('touchstart', initAudio, { once: true });

        function playAlertSound() {
            if (!soundEnabled) return;
            initAudio();
            
            const tones = [523.25, 493.88, 523.25, 493.88];
            tones.forEach((freq, idx) => {
                const now = audioCtx.currentTime + (idx * 0.12);
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.1);
            });
        }

        function playHoverSound() {
            if (!soundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.04);

            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playClickSound() {
            if (!soundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.06);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.06);
        }

        function playSearchFoundSound() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.setValueAtTime(1200, now + 0.08);

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.25);
        }

        document.getElementById('soundToggle').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').innerText = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) playClickSound();
        });

        // --- Замер пинга и параметров сети ---
        async function measureNetworkMetrics() {
            const start = performance.now();
            try {
                const response = await fetch('/api/uavs', { method: 'HEAD', cache: 'no-store' });
                const latency = Math.round(performance.now() - start);

                document.getElementById('apiLatencyVal').innerText = `${latency} ms`;

                if (navigator.connection && navigator.connection.rtt) {
                    document.getElementById('pingVal').innerText = `${navigator.connection.rtt} ms`;
                } else {
                    document.getElementById('pingVal').innerText = `${Math.round(latency * 0.7)} ms`;
                }

                if (latency < 250) {
                    document.getElementById('networkState').innerText = 'Отличное';
                    document.getElementById('networkState').style.color = 'var(--accent-green)';
                } else if (latency < 600) {
                    document.getElementById('networkState').innerText = 'Среднее';
                    document.getElementById('networkState').style.color = 'var(--accent-orange)';
                } else {
                    document.getElementById('networkState').innerText = 'Высокий пинг';
                    document.getElementById('networkState').style.color = 'var(--accent-red)';
                }
            } catch (e) {
                document.getElementById('apiLatencyVal').innerText = 'Ошибка';
                document.getElementById('networkState').innerText = 'Офлайн';
                document.getElementById('networkState').style.color = 'var(--accent-red)';
            }
        }

        setInterval(measureNetworkMetrics, 3000);
        measureNetworkMetrics();

        // --- Логика карты ---
        const map = L.map('map', { zoomControl: false }).setView([48.3794, 31.1656], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const activeMarkers = {};
        const activeCircles = {};
        let isInitialLoad = true;
        let searchMarker = null;
        let alertTimeout = null;

        const savedPositions = JSON.parse(localStorage.getItem('uav_positions') || '{}');

        async function getPlaceName(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await res.json();
                if (data && data.address) {
                    return data.address.village || data.address.town || data.address.city || data.address.county || "неизвестном районе";
                }
            } catch (e) {
                console.error("Ошибка геокодирования:", e);
            }
            return "неизвестном районе";
        }

        async function showAlertBanner(type, heading, lat, lon) {
            playAlertSound();
            const place = await getPlaceName(lat, lon);

            document.getElementById('alertTitle').innerText = `⚠️ ОБНАРУЖЕН ${type.toUpperCase()}`;
            document.getElementById('alertText').innerText = `Под угрозой: ${place}`;
            document.getElementById('alertSub').innerText = `Курс: ${heading}° | Координаты: ${lat.toFixed(3)}, ${lon.toFixed(3)}`;

            const banner = document.getElementById('alertBanner');
            banner.classList.add('active');

            if (alertTimeout) clearTimeout(alertTimeout);
            alertTimeout = setTimeout(() => {
                banner.classList.remove('active');
            }, 7000);
        }

        function getThreatSvg(rawType, heading) {
            const lowerType = String(rawType || '').toLowerCase();

            if (lowerType.includes('shahed') || lowerType.includes('шахед') || lowerType.includes('uav') || lowerType.includes('бпла')) {
                return `
                    <div class="liquid-marker">
                        <svg class="uav-svg" viewBox="0 0 24 24" fill="none" style="transform: rotate(${heading}deg);">
                            <path d="M12 2L2 21L12 17L22 21L12 2Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                    </div>
                `;
            } else if (lowerType.includes('каб') || lowerType.includes('kab') || lowerType.includes('бомб') || lowerType.includes('bomb')) {
                return `
                    <div class="liquid-marker">
                        <svg class="uav-svg" viewBox="0 0 24 24" fill="none" style="transform: rotate(${heading}deg);">
                            <path d="M12 2C10.5 2 9.5 3.5 9.5 5V9.5C8 11 7 13 7 15.5C7 18.5 9.2 21 12 21C14.8 21 17 18.5 17 15.5C17 13 16 11 14.5 9.5V5C14.5 3.5 13.5 2 12 2Z" fill="#F97316" stroke="#FFFFFF" stroke-width="1.5"/>
                        </svg>
                    </div>
                `;
            } else {
                return `
                    <div class="liquid-marker">
                        <svg class="uav-svg" viewBox="0 0 24 24" fill="none" style="transform: rotate(${heading}deg);">
                            <circle cx="12" cy="12" r="7" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
                        </svg>
                    </div>
                `;
            }
        }

        function createUAVIcon(type, heading) {
            return L.divIcon({
                html: getThreatSvg(type, heading),
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
        }

        window.copyTGReport = function(type, heading, lat, lon) {
            playClickSound();
            const text = `⚠️ **УГРОЗА:** ${type}\n🧭 **Курс:** ${heading}°\n📍 **Координаты:** ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            navigator.clipboard.writeText(text).then(() => {
                alert('Сводка скопирована в буфер обмена!');
            });
        };

        async function fetchUAVData() {
            try {
                const response = await fetch('/api/uavs');
                if (!response.ok) throw new Error("Ошибка соединения");

                const result = await response.json();
                const uavs = result.data || [];
                const currentIds = new Set();
                const now = Date.now();

                let totalCount = 0;
                let kabCount = 0;

                for (let index = 0; index < uavs.length; index++) {
                    const uav = uavs[index];
                    const id = String(uav.id || `uav_${index}`);
                    currentIds.add(id);

                    const newLat = parseFloat(uav.latitude);
                    const newLon = parseFloat(uav.longitude);
                    const heading = parseFloat(uav.heading || 0);
                    const type = uav.type || 'БПЛА';

                    totalCount++;
                    if (type.toLowerCase().includes('каб')) kabCount++;

                    if (!isNaN(newLat) && !isNaN(newLon)) {
                        if (activeMarkers[id]) {
                            if (activeMarkers[id].baseLat !== newLat || activeMarkers[id].baseLon !== newLon) {
                                activeMarkers[id].baseLat = newLat;
                                activeMarkers[id].baseLon = newLon;
                                activeMarkers[id].currentLat = newLat;
                                activeMarkers[id].currentLon = newLon;
                            }
                            activeMarkers[id].heading = heading;
                            activeMarkers[id].type = type;
                        } else {
                            let startLat = newLat;
                            let startLon = newLon;
                            let lastTime = now;

                            if (savedPositions[id] && savedPositions[id].baseLat === newLat && savedPositions[id].baseLon === newLon) {
                                startLat = savedPositions[id].currentLat;
                                startLon = savedPositions[id].currentLon;
                                lastTime = savedPositions[id].lastUpdate || now;
                            }

                            const marker = L.marker([startLat, startLon], {
                                icon: createUAVIcon(type, heading)
                            }).addTo(map);

                            marker.on('mouseover', () => playHoverSound());
                            marker.on('click', () => playClickSound());

                            const circle = L.circle([startLat, startLon], {
                                radius: 5000,
                                color: '#ef4444',
                                fillColor: '#ef4444',
                                fillOpacity: 0.15,
                                weight: 1
                            }).addTo(map);

                            activeMarkers[id] = marker;
                            activeCircles[id] = circle;

                            activeMarkers[id].baseLat = newLat;
                            activeMarkers[id].baseLon = newLon;
                            activeMarkers[id].currentLat = startLat;
                            activeMarkers[id].currentLon = startLon;
                            activeMarkers[id].heading = heading;
                            activeMarkers[id].type = type;
                            activeMarkers[id].lastUpdate = lastTime;

                            if (!isInitialLoad) {
                                showAlertBanner(type, heading, startLat, startLon);
                            }
                        }
                    }
                }

                isInitialLoad = false;

                document.getElementById('activeCount').innerText = totalCount;
                document.getElementById('kabCount').innerText = kabCount;
                document.getElementById('statusDot').style.backgroundColor = 'var(--accent-green)';

                Object.keys(activeMarkers).forEach(id => {
                    if (!currentIds.has(id)) {
                        map.removeLayer(activeMarkers[id]);
                        map.removeLayer(activeCircles[id]);
                        delete activeMarkers[id];
                        delete activeCircles[id];
                        delete savedPositions[id];
                    }
                });

            } catch (error) {
                console.error("Ошибка API:", error);
                document.getElementById('statusDot').style.backgroundColor = 'var(--accent-red)';
            }
        }

        function moveUAVs() {
            const now = Date.now();
            const positionsToSave = {};

            Object.keys(activeMarkers).forEach(id => {
                const marker = activeMarkers[id];
                const circle = activeCircles[id];
                if (isNaN(marker.currentLat) || isNaN(marker.currentLon)) return;

                const deltaSeconds = (now - (marker.lastUpdate || now)) / 1000;
                marker.lastUpdate = now;

                const heading = marker.heading || 0;
                const type = marker.type || 'БПЛА';
                const rad = ((heading - 90) * Math.PI) / 180;
                
                const speedPerSecond = 0.0005; 
                const distance = speedPerSecond * deltaSeconds;

                marker.currentLat -= Math.sin(rad) * distance;
                marker.currentLon += Math.cos(rad) * distance;

                marker.setLatLng([marker.currentLat, marker.currentLon]);
                if (circle) circle.setLatLng([marker.currentLat, marker.currentLon]);

                marker.setIcon(createUAVIcon(type, heading));

                marker.bindPopup(`
                    <div class="popup-card">
                        <div class="popup-title">⚠️ ${type}</div>
                        <b>Курс:</b> ${heading}°<br>
                        <b>Широта:</b> ${marker.currentLat.toFixed(4)}<br>
                        <b>Долгота:</b> ${marker.currentLon.toFixed(4)}<br>
                        <button class="tg-copy-btn" onclick="copyTGReport('${type}', ${heading}, ${marker.currentLat}, ${marker.currentLon})">
                            📋 Скопировать для TG
                        </button>
                    </div>
                `);

                positionsToSave[id] = {
                    baseLat: marker.baseLat,
                    baseLon: marker.baseLon,
                    currentLat: marker.currentLat,
                    currentLon: marker.currentLon,
                    lastUpdate: now
                };
            });

            localStorage.setItem('uav_positions', JSON.stringify(positionsToSave));
        }

        async function searchLocation() {
            playClickSound();
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);

                    playSearchFoundSound();
                    map.flyTo([lat, lon], 12, { duration: 1.5 });

                    if (searchMarker) map.removeLayer(searchMarker);
                    searchMarker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`📍 <b>${data[0].display_name.split(',')[0]}</b>`)
                        .openPopup();
                } else {
                    alert('Населенный пункт не найден');
                }
            } catch (err) {
                console.error("Ошибка поиска:", err);
            }
        }

        document.getElementById('searchBtn').addEventListener('click', searchLocation);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchLocation();
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            playClickSound();
            document.body.classList.toggle('dark-mode');
        });

        document.getElementById('recenterBtn').addEventListener('click', () => {
            playClickSound();
            map.flyTo([48.3794, 31.1656], 6, { duration: 1.5 });
        });

        fetchUAVData();
        setInterval(fetchUAVData, 5000);
        setInterval(moveUAVs, 100);
    </script>
</body>
</html>
